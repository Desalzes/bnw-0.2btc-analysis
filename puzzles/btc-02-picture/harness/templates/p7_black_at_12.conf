# 2026-09-29 (model P, GPU tier T2). Running it needs explicit operator
# sign-off (ADR-0001 rail 4); results are logged in STATE.md.
# One slice of p7_moonpass_pins_only: black at slot 12. p6 is the slice
# with black@10; p6 and the seven p7_black_at_* slices (2 4 5 6 7 8 12)
# enumerate exactly what p7 enumerates, split by the slot of the REQUIRE'd
# black (a leftover slot may repeat a word, as in p7 itself).
SCHEME bip39
WORDS 12
FIX 1 subject
FIX 3 tower
FIX 12 black
FIX 9 eye
FIX 11 pyramid
REQUIRE food this real one order
POOL @WORDLIST
PATH m/44'/0'/0'/0/0
PATH m/44'/0'/0'/0/1
PATH m/44'/0'/0'/0/10
PATH m/0'/0/0
PATH m/0/0
PASS MOON
PASS moon
PASS Moon
