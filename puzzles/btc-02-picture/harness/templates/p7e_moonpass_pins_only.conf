# 2026-09-29 (model P, GPU tier T2). Running it needs explicit operator
# sign-off (ADR-0001 rail 4); results are logged in STATE.md.
# as p7, Electrum-12 with the extension 'moon' (Electrum normalises the
# extension, so this one covers every casing). The E4 structure, 12 words.
SCHEME electrum
WORDS 12
FIX 1 subject
FIX 3 tower
FIX 9 eye
FIX 11 pyramid
REQUIRE food this real one order black
POOL @WORDLIST
PATH m/0/0
PATH m/0/1
PATH m/0/2
PATH m/1/0
PASS moon
