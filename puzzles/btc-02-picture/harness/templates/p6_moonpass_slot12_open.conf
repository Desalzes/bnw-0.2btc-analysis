# 2026-09-29 (model P, GPU tier T2). Running it needs explicit operator
# sign-off (ADR-0001 rail 4); results are logged in STATE.md.
# as p3 but the 2 open words come from the FULL list: every device pin of
# model P (subject@1 tower@3 eye@9 black@10 pyramid@11), vote dropped, so
# slot 12 is open. The E3 structure with MOON as the passphrase.
SCHEME bip39
WORDS 12
FIX 1 subject
FIX 3 tower
FIX 9 eye
FIX 10 black
FIX 11 pyramid
REQUIRE food this real one order
POOL @WORDLIST
PATH m/44'/0'/0'/0/0
PATH m/44'/0'/0'/0/1
PATH m/44'/0'/0'/0/10
PATH m/0'/0/0
PATH m/0/0
PASS MOON
PASS moon
PASS Moon
