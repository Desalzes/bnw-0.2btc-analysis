# 2026-09-22, operator sign-off in chat (passphrase batch). Positional ledger run E2: as E1 but
# black is NOT pinned to 10 (the rune's X is undecidable), so the 6 marked
# words go anywhere in the 7 free slots; the last free slot takes ANY word.
SCHEME electrum
WORDS 13
FIX 1 subject
FIX 3 tower
FIX 9 eye
FIX 11 pyramid
FIX 12 vote
FIX 13 moon
REQUIRE food this real black one order
POOL @WORDLIST
PATH m/0/0
PATH m/0/1
PATH m/0/2
PATH m/1/0
# Passphrases approved in chat; Electrum lowercases them, so the casings
# collapse to: breathe 10 ten x guardian (empty is re-tested too).
PASS breathe
PASS BREATHE
PASS Breathe
PASS 10
PASS ten
PASS X
PASS x
PASS Guardian
